# Env vars are expanded before parsing, so the bucket comes from the container env.

dbs:
  - path: ${DB_PATH}
    replica:
      type: gs
      bucket: ${LITESTREAM_BUCKET}
      path: db/blog
      sync-interval: 1s

# Full-snapshot cadence and how far back you can point-in-time restore.
# Defaults are fine for a blog; stated explicitly so they're a decision, not an accident.
snapshot:
  interval: 24h
  retention: 168h
