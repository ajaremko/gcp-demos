[project]
name = "crawler"
version = "0.1.0"
description = "Site change monitor — Scrapy crawler with field-level diffing"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.11",
    "itemloaders",
    "itemadapter",
    "pyyaml",
    "w3lib",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-storage",
    "google-cloud-pubsub",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
